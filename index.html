    <script>
      // Browser extension compatibility: ensure window.fetch has both getter and setter
      (function() {
        try {
          var _rawFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _rawFetch;
            },
            set: function(newFetch) {
              _rawFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // ignore if already configured
        }
      })();
    </script>
